[project]
name = "bts-agentbench"
version = "0.1.0"
description = "BTS-AgentBench: a tool-using benchmark for building operations over Brick metadata and BTS telemetry."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "duckdb>=1.2.2",
  "numpy>=1.26",
  "openai>=2.30.0",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "rdflib>=7.0",
  "requests>=2.31",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
