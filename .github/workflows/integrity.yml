name: artifact-integrity

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Compile source
        run: python -m compileall -q scripts src
      - name: Verify packaged release
        run: python scripts/verify_packaged_release.py
      - name: Verify fixed model traces
        run: |
          python scripts/audit_model_traces.py
          git diff --exit-code reports/model-runs/trace_audit.json
      - name: Render a submitted scenario trace
        run: |
          python scripts/trace_scenario.py test_timestamp_value_lookup_00051 \
            --model-trace reports/model-runs/gpt-5.5/test.jsonl \
            --format json \
            --output /tmp/submitted-trace.json
